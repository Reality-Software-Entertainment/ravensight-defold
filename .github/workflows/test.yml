name: test

# Nightly on weekdays and on demand, never on a push or a pull request
# (owner decision, November 19, 2026). Changes are checked locally first by
# the pre-push hook in .githooks; this run is the safety net behind it, and
# a night when main has not moved since the last green run costs one short job.
on:
  schedule:
    - cron: '28 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet:
    # A scheduled run on a main that already passed is skipped; a dispatch always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last green nightly ($last)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lua:
    name: Specs under LuaJIT
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - run: luajit spec/run.lua

  engine:
    name: Specs and a live run inside the Defold engine
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEFOLD_SHA1: d295ed4edff2e49072719835713e625f409849f1 # Defold 1.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Engine libraries and a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libopenal1 libgl1 libglx-mesa0 libegl1 libgles2 libgles1 libvulkan1 mesa-vulkan-drivers libxi6 libxext6 libx11-6
      - name: Download bob and the engine
        run: |
          mkdir -p tools
          curl -sfL -o tools/bob.jar "https://d.defold.com/archive/stable/${DEFOLD_SHA1}/bob/bob.jar"
          curl -sfL -o tools/dmengine "https://d.defold.com/archive/stable/${DEFOLD_SHA1}/engine/x86_64-linux/dmengine"
          chmod +x tools/dmengine
      - name: Engine test
        run: DMENGINE="$PWD/tools/dmengine" node test/engine.mjs tools/bob.jar test/engine-xvfb.sh java
