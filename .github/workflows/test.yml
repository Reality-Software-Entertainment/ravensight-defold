name: test

on:
  push:
  pull_request:

jobs:
  lua:
    name: Specs under LuaJIT
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit
      - run: luajit spec/run.lua

  engine:
    name: Specs and a live run inside the Defold engine
    runs-on: ubuntu-24.04
    env:
      DEFOLD_SHA1: d295ed4edff2e49072719835713e625f409849f1 # Defold 1.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Engine libraries and a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libopenal1 libgl1 libglx-mesa0 libegl1 libgles2 libgles1 libvulkan1 mesa-vulkan-drivers libxi6 libxext6 libx11-6
      - name: Download bob and the engine
        run: |
          mkdir -p tools
          curl -sfL -o tools/bob.jar "https://d.defold.com/archive/stable/${DEFOLD_SHA1}/bob/bob.jar"
          curl -sfL -o tools/dmengine "https://d.defold.com/archive/stable/${DEFOLD_SHA1}/engine/x86_64-linux/dmengine"
          chmod +x tools/dmengine
      - name: Engine test
        run: DMENGINE="$PWD/tools/dmengine" node test/engine.mjs tools/bob.jar test/engine-xvfb.sh java
